<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Efforts Wiki</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="shelves-toggle" type="button" id="shelves-toggle" aria-expanded="false" aria-controls="sidebar">
      Shelves
    </button>
    <a class="wordmark" href="#/">
      <span class="wordmark-name">Efforts</span>
      <span class="wordmark-kind">Wiki</span>
    </a>
    <form class="search" role="search" id="search-form">
      <label class="sr-only" for="search">Search articles</label>
      <input id="search" type="search" placeholder="Search articles" autocomplete="off" />
    </form>
    <p class="count" id="count"></p>
  </header>

  <div class="frame">
    <nav class="sidebar" id="sidebar" aria-label="Shelves"></nav>
    <main class="canvas" id="canvas">
      <p class="loading">Opening the library…</p>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
